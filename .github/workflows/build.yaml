name: Build source list
on:
  push:
    branches:
      - main
    paths:
      - "sources/**"
      - "templates/**"
      - ".github/actions/install-aidoku-cli/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: Rebuild every source instead of reusing published packages
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # previously published packages, reused for sources whose version hasn't changed
      - uses: actions/checkout@v6
        if: ${{ !inputs.full_rebuild }}
        continue-on-error: true
        with:
          ref: gh-pages
          path: previous

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache rust stuff
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            sources/**/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: ./.github/actions/install-aidoku-cli

      - name: Build sources
        run: |
          set -euo pipefail

          mkdir -p packages

          for source in sources/*; do
            [[ -f "$source/Cargo.toml" ]] || continue

            id="$(jq -r .info.id "$source/res/source.json")"
            version="$(jq -r .info.version "$source/res/source.json")"
            previous="previous/sources/$id-v$version.aix"

            if [[ -f "$previous" ]]; then
              echo "Reusing $id v$version"
              cp "$previous" "packages/$id.aix"
              continue
            fi

            echo "::group::Packaging $source"
            (
              cd "$source"
              aidoku package
            )
            cp "$source/package.aix" "packages/$id.aix"
            echo "::endgroup::"
          done

      - name: Build source list
        run: |
          aidoku build packages/*.aix --name "Aidoku Community Sources"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.7.2
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          branch: gh-pages
          folder: public
          git-config-name: GitHub Actions
          git-config-email: github-actions[bot]@users.noreply.github.com
          commit-message: Update source list
          single-commit: true

      - name: Uploading packages as artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: public/sources/*.aix
          if-no-files-found: ignore
